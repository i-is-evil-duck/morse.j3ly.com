<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Morse Trainer (Gboard Edition)</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #202124;
      --accent-blue: #1a73e8;
      --accent-green: #34a853;
      --accent-red: #ea4335;
      --hint-bg: #f1f3f4;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    #keyboard-trigger {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      top: -9999px;
      left: -9999px;
    }

    .app-card {
      background: var(--card-bg);
      width: 90%;
      max-width: 480px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s ease;
      border: 3px solid transparent;
      margin-top: 2rem;
    }

    .app-card:focus-within, .app-card:active {
      border-color: var(--accent-blue);
    }

    .instruction-tag {
      font-size: 0.85rem;
      color: #70757a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
    }

    .word-display {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.4rem;
      margin-bottom: 2rem;
      word-break: break-all;
    }

    .letter {
      color: #dadce0;
      transition: color 0.2s ease;
    }

    .letter.active {
      color: var(--accent-blue);
      text-decoration: underline;
      text-underline-offset: 8px;
    }

    .letter.correct {
      color: var(--accent-green);
    }

    .letter.error {
      color: var(--accent-red);
    }

    .hint-box {
      background-color: var(--hint-bg);
      border-radius: 12px;
      padding: 1.25rem;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .hint-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hint-title {
      font-size: 0.9rem;
      color: #5f6368;
      margin-bottom: 0.25rem;
    }

    .hint-morse {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.2rem;
      color: var(--accent-blue);
    }

    .hint-mnemonic {
      font-size: 1.1rem;
      font-weight: 600;
      color: #3c4043;
      margin-top: 0.25rem;
    }

    .score-tracker {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #70757a;
    }
  </style>
</head>
<body>

  <input type="text" id="keyboard-trigger" autocomplete="off" />

    <div class="instruction-tag">Tap to Open Keyboard & Type</div>
    
    <div class="word-display" id="word-container"></div>

    </div>

    <div class="score-tracker" id="score-display">Words Solved: 0</div>

    // Calculate word weights with an exponential factor for rare letters
    function calculateWordWeight(word) {
      let weight = 0;
      for (const char of word) {
        weight += MORSE_MAP[char] ? Math.pow(MORSE_MAP[char].weight, 1.3) : 1.0;
      }
      return weight;
    }

    // Pre-calculate cumulative weights for sampling
    const wordWeights = WORD_LIST.map(calculateWordWeight);
    const cumulativeWeights = [];
    let totalWeight = 0;

    for (let i = 0; i < wordWeights.length; i++) {
      totalWeight += wordWeights[i];
      cumulativeWeights.push(totalWeight);
    }

    // Weighted Random Choice Algorithm
    function getRandomWeightedWord() {
      const randomValue = Math.random() * totalWeight;
      for (let i = 0; i < cumulativeWeights.length; i++) {
        if (randomValue < cumulativeWeights[i]) {
          return WORD_LIST[i];
        }
      }
      return WORD_LIST[0];
    }

    let currentWord = "";
    let currentCharIndex = 0;
    let wordsSolved = parseInt(localStorage.getItem("morse_words_solved"), 10) || 0;
    let hintTimer = null;
    const HINT_DELAY_MS = 2500;

    const interactiveZone = document.getElementById("interactive-zone");
    const keyTrigger = document.getElementById("keyboard-trigger");
    const wordContainer = document.getElementById("word-container");
    const hintContainer = document.getElementById("hint-container");
    const hintMorse = document.getElementById("hint-morse");
    const hintMnemonic = document.getElementById("hint-mnemonic");
    const scoreDisplay = document.getElementById("score-display");

    scoreDisplay.textContent = `Words Solved: ${wordsSolved}`;

    interactiveZone.addEventListener("click", () => {
      keyTrigger.focus();
    });

    function loadWord() {
      currentWord = getRandomWeightedWord();
      wordContainer.innerHTML = "";
      for (let i = 0; i < currentWord.length; i++) {
        const span = document.createElement("span");
        span.textContent = currentWord[i];
        span.className = "letter" + (i === 0 ? " active" : "");
        wordContainer.appendChild(span);
      }
      currentCharIndex = 0;
      hideHint();
      resetHintTimer();
    }

    keyTrigger.addEventListener("input", (e) => {
      const typedChar = e.target.value.slice(-1).toUpperCase();
      keyTrigger.value = "";
      
      if (!typedChar.match(/[A-Z]/)) return;

      const targetChar = currentWord[currentCharIndex];
      const letters = wordContainer.children;

      if (typedChar === targetChar) {
        letters[currentCharIndex].className = "letter correct";
        currentCharIndex++;
        hideHint();

        if (currentCharIndex < currentWord.length) {
          letters[currentCharIndex].className = "letter active";
          resetHintTimer();
        } else {
          clearTimeout(hintTimer);
          wordsSolved++;
          localStorage.setItem("morse_words_solved", wordsSolved);
          scoreDisplay.textContent = `Words Solved: ${wordsSolved}`;
          setTimeout(loadWord, 400);
        }
      } else {
        letters[currentCharIndex].className = "letter active error";
        setTimeout(() => {
          if (letters[currentCharIndex]) letters[currentCharIndex].className = "letter active";
        }, 400);
      }
    });

    function resetHintTimer() {
      clearTimeout(hintTimer);
      hintTimer = setTimeout(showHint, HINT_DELAY_MS);
    }

    function showHint() {
      const char = currentWord[currentCharIndex];
      const data = MORSE_MAP[char];

      if (data) {
        hintMorse.textContent = data.morse;
        hintMnemonic.textContent = `${char} = ${data.mnemonic}`;
        hintContainer.classList.add("visible");
      }
    }

    function hideHint() {
      hintContainer.classList.remove("visible");
    }

    loadWord();
  </script>
</body>
</html>
